services:
  postgres:
    image: postgres:16
    container_name: blockflow-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: blockflow
      POSTGRES_PASSWORD: blockflow
      POSTGRES_DB: blockflow
    volumes:
      - blockflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockflow -d blockflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  blockflow_pgdata:
